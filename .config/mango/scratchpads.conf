#################################
#          Scratchpads          #
#################################

# Compartir scratchpads a través de los monitores
scratchpad_cross_monitor=1

# Permitir sólo un scratchpad visible a la vez
single_scratchpad=1

# Anchura predeterminada de los scratchpads relativa 
# al tamaño de la pantalla
scratchpad_width_ratio=0.8

# Altura predeterminada de los scratchpads relativa 
# al tamaño de la pantalla
scratchpad_height_ratio=0.9

# Scratchpad de terminal
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:st-scratch
#bind=SUPER+CTRL,s,toggle_named_scratchpad,st-scratch,none,st -c st-scratch
bind=SUPER+CTRL,Return,toggle_named_scratchpad,st-scratch,none,st -c st-scratch

# Match by title
windowrule=isnamedscratchpad:1,width:1000,height:700,title:kitty-scratch

